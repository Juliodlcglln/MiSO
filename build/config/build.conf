# MiSO Desktop - configuración del build
# shellcheck shell=bash

MISO_VERSION="0.1.0"
MISO_CODENAME="Genesis"
MISO_ARCH="amd64"

# Base Debian
DEBIAN_SUITE="trixie"
DEBIAN_MIRROR="http://deb.debian.org/debian"
DEBIAN_SECURITY_MIRROR="http://security.debian.org/debian-security"
DEBIAN_COMPONENTS="main,contrib,non-free-firmware"
DEBIAN_UPDATES="${DEBIAN_SUITE}-updates"
DEBIAN_SECURITY="${DEBIAN_SUITE}-security"

# Identidad y valores por defecto del sistema live
MISO_HOSTNAME="miso"
MISO_LIVE_USER="live"
MISO_LIVE_PASSWORD="live"
MISO_LIVE_FULLNAME="MiSO Live"
MISO_LOCALE="es_MX.UTF-8"
MISO_KEYMAP="latam"
MISO_TIMEZONE="America/Mexico_City"

# Build
DEFAULT_PROFILE="desktop"
WORKDIR="${MISO_WORKDIR:-/var/tmp/miso-build}"
OUTDIR="${MISO_OUTDIR:-${PROJECT_ROOT}/out}"
ISO_VOLID="MISO_DESKTOP"
