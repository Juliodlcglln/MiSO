---
efiSystemPartition: "/boot/efi"
userSwapChoices:
  - none
  - small
  - file
drawNestedPartitions: true
alwaysShowPartitionLabels: true
defaultFileSystemType: "btrfs"
availableFileSystemTypes:
  - btrfs
  - ext4
# Sin preseleccionar "borrar disco": evita destruir un disco por accidente.
initialPartitioningChoice: "none"
initialSwapChoice: "none"
requiredStorage: 12
luksGeneration: "luks2"

# Los subvolúmenes btrfs se definen en mount.conf (módulo mount).
# Aquí solo se elige el sistema de archivos por defecto.
