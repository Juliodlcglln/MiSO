---
# Módulo mount de Calamares para MiSO Desktop.
# Aquí viven los subvolúmenes btrfs y las opciones de montaje; el módulo
# fstab los reutiliza para generar /etc/fstab.

extraMounts: []

mountOptions:
  - filesystem: default
    options: [defaults, noatime]
  - filesystem: btrfs
    options: [defaults, noatime, compress=zstd:1]
  - filesystem: ext4
    options: [defaults, noatime]
  - filesystem: efi
    options: [umask=0077]

# @            -> /            (sistema)
# @home        -> /home        (datos de usuario, fuera de las instantáneas)
# @snapshots   -> /.snapshots  (instantáneas, fuera de sí mismas)
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /.snapshots
    subvolume: /@snapshots
