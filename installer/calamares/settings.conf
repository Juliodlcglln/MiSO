---
# Configuración de Calamares para MiSO Desktop
modules-search: [ local ]

instances:
  - id: miso
    module: shellprocess
    config: shellprocess@miso.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - shellprocess@miso
      - grubcfg
      - initramfs
      - bootloader
      - umount
  - show:
      - finished

branding: miso
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
